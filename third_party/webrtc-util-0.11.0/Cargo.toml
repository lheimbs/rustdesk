[package]
edition = "2021"
name = "webrtc-util"
version = "0.11.0"
authors = ["Rain Liu <yliu@webrtc.rs>"]
description = "Utilities for WebRTC.rs stack"
homepage = "https://webrtc.rs"
documentation = "https://docs.rs/webrtc-util"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/webrtc-rs/webrtc/tree/master/util"

[[bench]]
name = "bench"
harness = false

[dependencies]
async-trait = "0.1"
bytes = "1"
ipnet = "2.6.0"
lazy_static = "1"
log = "0.4"
portable-atomic = "1.6"
rand = "0.8"
thiserror = "1"

[dependencies.tokio]
version = "1.32.0"
features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
]

[dev-dependencies]
async-global-executor = "2"
chrono = "0.4.28"
env_logger = "0.11.3"
tokio-test = "0.4"

[dev-dependencies.criterion]
version = "0.5"
features = ["async_futures"]

[features]
buffer = []
conn = [
    "buffer",
    "sync",
]
default = [
    "buffer",
    "conn",
    "ifaces",
    "vnet",
    "marshal",
    "sync",
]
ifaces = []
marshal = []
sync = []
vnet = ["ifaces"]

[target."cfg(not(windows))".dependencies]
libc = "0.2.126"
nix = "0.26.2"

[target."cfg(windows)".dependencies]
bitflags = "1.3"

[target."cfg(windows)".dependencies.winapi]
version = "0.3.9"
features = [
    "basetsd",
    "guiddef",
    "ws2def",
    "winerror",
    "ws2ipdef",
]
