[package]
edition = "2021"
name = "tfc"
version = "0.7.0"
authors = ["Indiana Kernick <indiana.kernick@gmail.com>"]
exclude = [
    ".gitignore",
    ".idea",
    "docs",
    "iOS_client",
]
description = "The Fat Controller. A library for simulating mouse and keyboard events."
homepage = "https://github.com/indianakernick/The-Fat-Controller"
readme = "README.md"
keywords = [
    "keyboard",
    "mouse",
    "automation",
    "control",
]
categories = [
    "os::linux-apis",
    "os::macos-apis",
    "os::windows-apis",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/indianakernick/The-Fat-Controller"

[profile.release]
lto = true

[dependencies]
anyhow = "1.0.58"

[dependencies.tokio]
version = "1"
features = ["time"]
optional = true

[dev-dependencies]
lazy_static = "1.4"

[features]
ascii-fallback = []
check-x11 = []
default = ["check-x11"]
x11 = []

[target."cfg(target_os = \"linux\")".dependencies.x11]
