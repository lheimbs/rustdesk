[dependencies]
aes = "0.8"
aes-gcm = "0.10"
async-trait = "0.1"
bincode = "1"
byteorder = "1"
ccm = "0.5"
der-parser = "9.0"
hkdf = "0.12"
hmac = "0.12"
log = "0.4"
p384 = "0.13"
portable-atomic = "1.6"
rand = "0.8"
rand_core = "0.6"
rcgen = "0.13"
ring = "0.17.14"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "1"
x509-parser = "0.16"

[dependencies.cbc]
version = "0.1"
features = [
    "block-padding",
    "alloc",
]

[dependencies.p256]
version = "0.13"
features = [
    "default",
    "ecdh",
    "ecdsa",
]

[dependencies.pem]
version = "3"
optional = true

[dependencies.rustls]
version = "0.23.27"
features = [
    "std",
    "ring",
]
default-features = false

[dependencies.sec1]
version = "0.7"
features = ["std"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.tokio]
version = "1.32.0"
features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
]

[dependencies.util]
version = "0.11.0"
path = "../util"
features = ["conn"]
default-features = false
package = "webrtc-util"

[dependencies.x25519-dalek]
version = "2"
features = ["static_secrets"]

[dev-dependencies]
