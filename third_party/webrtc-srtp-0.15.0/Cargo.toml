[dependencies.aes-gcm]
version = "0.10"
features = ["std"]

[dependencies.hmac]
version = "0.12"
features = ["std"]

[dependencies.openssl]
version = "0.10.72"
optional = true

[dependencies.rtcp]
version = "0.13.0"
path = "../rtcp"

[dependencies.rtp]
version = "0.13.0"
path = "../rtp"

[dependencies.tokio]
version = "1.32.0"
features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
]

[dependencies.util]
